<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha · Doutor Paladar</title>
    <meta name="description" content="Recupere ou redefina sua senha de acesso ao sistema Doutor Paladar.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            min-height: 100vh;
            background: #080c10;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(45, 125, 82, 0.2) 0px, transparent 55%),
                radial-gradient(ellipse at 90% 80%, rgba(27, 67, 50, 0.25) 0px, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 188, 13, 0.05) 0px, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
            color: #f8fafc;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(20px);
            color: #0f172a;
            border-radius: 32px;
            padding: 2.8rem 2.2rem;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            animation: authFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #0f172a;
            margin-bottom: 1.2rem;
        }

        .auth-logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2d7d52, #1b4332);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffbc0d;
            font-size: 1.4rem;
            box-shadow: 0 6px 20px rgba(45, 125, 82, 0.35);
        }

        .auth-title {
            font-family: var(--font-heading, 'Outfit', sans-serif);
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin-bottom: 0.4rem;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            line-height: 1.5;
        }

        .auth-form-group {
            margin-bottom: 1.2rem;
        }

        .auth-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.45rem;
        }

        .auth-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-wrap i.input-icon {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
        }

        .auth-input-wrap:focus-within i.input-icon {
            color: #2d7d52;
        }

        .auth-input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            font-family: inherit;
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.25s ease;
            outline: none;
        }

        .auth-input:hover {
            border-color: #cbd5e1;
        }

        .auth-input:focus {
            border-color: #2d7d52;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(45, 125, 82, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .toggle-password:hover {
            color: #334155;
            background: rgba(0, 0, 0, 0.04);
        }

        .password-rules {
            font-size: 0.76rem;
            color: #64748b;
            margin-top: 0.35rem;
            line-height: 1.35;
        }

        .auth-btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #2d7d52, #1b4332);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(45, 125, 82, 0.3);
            margin-top: 0.8rem;
        }

        .auth-btn-primary:hover {
            background: linear-gradient(135deg, #1b4332, #0d2818);
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(45, 125, 82, 0.4);
        }

        .auth-feedback-msg {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            display: none;
            line-height: 1.4;
        }

        .auth-feedback-msg.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }

        .auth-feedback-msg.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .auth-footer {
            margin-top: 2rem;
            padding-top: 1.4rem;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .auth-link {
            color: #2d7d52;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: #1b4332;
            text-decoration: underline;
        }

        .btn-auth-back {
            position: absolute;
            top: 22px;
            left: 22px;
            background: #f1f5f9;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-auth-back:hover {
            background: #e2e8f0;
            color: #0f172a;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="login.html" class="btn-auth-back" title="Voltar ao login">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <div class="auth-logo-icon" style="background:#ffffff; overflow:hidden; border:2px solid #ffbc0d; border-radius:50%; width:44px; height:44px; display:flex; align-items:center; justify-content:center;">
                    <img src="imagens/logo_icone.jpg" alt="Doutor Paladar" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 1.15rem; font-weight: 800; line-height: 1.1;">DOUTOR PALADAR</div>
                    <div style="font-size: 0.7rem; color: #d97706; font-weight: 800; text-transform: uppercase;">Lanchonete</div>
                </div>
            </a>
            <h1 class="auth-title">Recuperar Senha</h1>
            <p class="auth-subtitle">Informe seu usuário ou telefone cadastrado para redefinir sua senha.</p>
        </div>

        <div id="recuperarFeedback" class="auth-feedback-msg"></div>

        <form id="recuperarForm" onsubmit="realizarRecuperacao(event)">
            <div class="auth-form-group">
                <label class="auth-label" for="recLogin">Usuário ou Telefone (WhatsApp) *</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-user-circle input-icon"></i>
                    <input type="text" id="recLogin" class="auth-input" placeholder="Ex: mariasilva ou 12999999999" required autofocus>
                </div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label" for="recNovaSenha">Nova Senha *</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="recNovaSenha" class="auth-input" placeholder="Digite sua nova senha" required>
                    <button type="button" class="toggle-password" onclick="alternarVisibilidadeSenha('recNovaSenha', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-rules">Mínimo de 6 caracteres, com pelo menos 1 número e 1 símbolo.</div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label" for="recConfirmarSenha">Confirmar Nova Senha *</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-shield-alt input-icon"></i>
                    <input type="password" id="recConfirmarSenha" class="auth-input" placeholder="Repita a nova senha" required>
                    <button type="button" class="toggle-password" onclick="alternarVisibilidadeSenha('recConfirmarSenha', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-btn-primary" id="btnRedefinir">
                <span>Redefinir Senha</span>
                <i class="fas fa-check"></i>
            </button>
        </form>

        <div class="auth-footer">
            Lembrou da sua senha antiga? <br>
            <a href="login.html" class="auth-link" style="display: inline-block; margin-top: 6px;">
                <i class="fas fa-sign-in-alt"></i> Voltar ao Login
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        function alternarVisibilidadeSenha(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        }

        async function realizarRecuperacao(e) {
            e.preventDefault();
            const login = document.getElementById('recLogin').value.trim();
            const novaSenha = document.getElementById('recNovaSenha').value;
            const confirmarSenha = document.getElementById('recConfirmarSenha').value;
            const feedback = document.getElementById('recuperarFeedback');
            const btn = document.getElementById('btnRedefinir');

            feedback.className = 'auth-feedback-msg';
            feedback.style.display = 'none';

            if (!login || !novaSenha || !confirmarSenha) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'Por favor, preencha todos os campos.';
                return;
            }

            if (novaSenha !== confirmarSenha) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'A confirmação não coincide com a nova senha digitada.';
                return;
            }

            if (novaSenha.length < 6 || !/[0-9]/.test(novaSenha) || !/[!@#$%^&*(),.?":{}|<>]/.test(novaSenha)) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'A nova senha deve ter no mínimo 6 caracteres, 1 número e 1 símbolo (ex: @, #, !).';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Atualizando senha...';

            try {
                const res = await fetch(`${API_URL}/clientes/recuperar-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, novaSenha, confirmarSenha })
                });

                const data = await res.json();

                if (res.ok) {
                    feedback.className = 'auth-feedback-msg success';
                    feedback.innerHTML = `✅ ${data.mensagem || 'Senha redefinida com sucesso!'}<br><small>Redirecionando para o login...</small>`;

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    feedback.className = 'auth-feedback-msg error';
                    feedback.textContent = data.erro || 'Não foi possível redefinir a senha. Verifique seus dados.';
                    btn.disabled = false;
                    btn.innerHTML = '<span>Redefinir Senha</span> <i class="fas fa-check"></i>';
                }
            } catch (error) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'Erro de conexão com o servidor. Tente novamente.';
                btn.disabled = false;
                btn.innerHTML = '<span>Redefinir Senha</span> <i class="fas fa-check"></i>';
            }
        }
    </script>
</body>
</html>
