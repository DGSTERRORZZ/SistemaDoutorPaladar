<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta Gratuita · Doutor Paladar</title>
    <meta name="description" content="Cadastre-se no Doutor Paladar e acumule pontos a cada pedido para resgatar salgados, sobremesas e bebidas.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            min-height: 100vh;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(45, 125, 82, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(27, 67, 50, 0.3) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            font-family: var(--font-sans, 'Plus Jakarta Sans', sans-serif);
            color: #f8fafc;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 28px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            position: relative;
            animation: authFadeIn 0.35s ease;
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
            margin-bottom: 1rem;
        }

        .auth-logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #2d7d52, #1b4332);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffbc0d;
            font-size: 1.4rem;
            box-shadow: 0 6px 16px rgba(45, 125, 82, 0.3);
        }

        .auth-title {
            font-family: var(--font-heading, 'Outfit', sans-serif);
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
            margin-bottom: 0.3rem;
        }

        .auth-subtitle {
            font-size: 0.88rem;
            color: #64748b;
        }

        .auth-form-group {
            margin-bottom: 1.1rem;
        }

        .auth-label {
            display: block;
            font-size: 0.84rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.35rem;
        }

        .auth-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input-wrap i.input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
        }

        .auth-input {
            width: 100%;
            padding: 11px 14px 11px 42px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.92rem;
            font-family: inherit;
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.2s ease;
            outline: none;
        }

        .auth-input:focus {
            border-color: #2d7d52;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(45, 125, 82, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
        }

        .toggle-password:hover {
            color: #334155;
        }

        .auth-btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #2d7d52, #1b4332);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            padding: 13px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(45, 125, 82, 0.3);
            margin-top: 0.8rem;
        }

        .auth-btn-primary:hover {
            background: linear-gradient(135deg, #1b4332, #0f291e);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(45, 125, 82, 0.4);
        }

        .auth-feedback-msg {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            display: none;
        }
        .auth-feedback-msg.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }
        .auth-feedback-msg.success {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
            display: block;
        }

        .auth-footer {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .auth-link {
            color: #2d7d52;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: #1b4332;
            text-decoration: underline;
        }

        .btn-auth-back {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-auth-back:hover {
            background: #e2e8f0;
            color: #0f172a;
            transform: translateX(-2px);
        }

        .password-rules {
            font-size: 0.76rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="javascript:void(0)" onclick="voltarParaOrigem()" class="btn-auth-back" title="Voltar à página anterior">
            <i class="fas fa-arrow-left"></i>
        </a>

        <div class="auth-header">
            <a href="index.html" class="auth-logo">
                <div class="auth-logo-icon"><i class="fas fa-utensils"></i></div>
                <div style="text-align: left;">
                    <div style="font-size: 1.15rem; font-weight: 800; line-height: 1.1;">DOUTOR PALADAR</div>
                    <div style="font-size: 0.7rem; color: #d97706; font-weight: 800; text-transform: uppercase;">Cantina & Gourmet</div>
                </div>
            </a>
            <h1 class="auth-title">Criar sua Conta</h1>
            <p class="auth-subtitle">Acumule pontos em todos os seus pedidos!</p>
        </div>

        <div id="cadastroFeedback" class="auth-feedback-msg"></div>

        <form id="cadastroForm" onsubmit="realizarCadastro(event)">
            <div class="auth-form-group">
                <label class="auth-label" for="cadNome">Nome Completo *</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="cadNome" class="auth-input" placeholder="Ex: Maria Silva" required autofocus>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="auth-form-group">
                    <label class="auth-label" for="cadUsuario">Usuário *</label>
                    <div class="auth-input-wrap">
                        <i class="fas fa-at input-icon"></i>
                        <input type="text" id="cadUsuario" class="auth-input" placeholder="mariasilva" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="cadTelefone">WhatsApp *</label>
                    <div class="auth-input-wrap">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="cadTelefone" class="auth-input" placeholder="(12) 99999-9999" required oninput="formatarTelefone(this)">
                    </div>
                </div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label" for="cadTurma">Turma / Cargo / Setor (Opcional)</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-graduation-cap input-icon"></i>
                    <input type="text" id="cadTurma" class="auth-input" placeholder="Ex: 3º Info / Professor">
                </div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label" for="cadSenha">Senha de Acesso *</label>
                <div class="auth-input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="cadSenha" class="auth-input" placeholder="Crie uma senha forte" required>
                    <button type="button" class="toggle-password" onclick="alternarVisibilidadeSenha('cadSenha', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-rules">Mínimo de 6 caracteres, com pelo menos 1 número e 1 símbolo.</div>
            </div>

            <button type="submit" class="auth-btn-primary" id="btnCadastrar">
                <span>Criar Conta & Ativar Fidelidade</span>
                <i class="fas fa-check-circle"></i>
            </button>
        </form>

        <div class="auth-footer">
            Já possui uma conta? <br>
            <a href="javascript:void(0)" onclick="navegarParaLogin()" class="auth-link" style="display: inline-block; margin-top: 6px;">
                <i class="fas fa-sign-in-alt"></i> Acessar Minha Conta
            </a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        function getReturnUrl() {
            const params = new URLSearchParams(window.location.search);
            const fromQuery = params.get('returnUrl');
            if (fromQuery) return fromQuery;
            const fromStorage = sessionStorage.getItem('dp_last_page');
            if (fromStorage && !fromStorage.includes('login.html') && !fromStorage.includes('cadastro.html')) {
                return fromStorage;
            }
            return 'index.html';
        }

        function voltarParaOrigem() {
            window.location.href = getReturnUrl();
        }

        function navegarParaLogin() {
            window.location.href = `login.html?returnUrl=${encodeURIComponent(getReturnUrl())}`;
        }

        function alternarVisibilidadeSenha(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        }

        function formatarTelefone(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            if (v.length > 6) {
                input.value = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
            } else if (v.length > 2) {
                input.value = `(${v.slice(0,2)}) ${v.slice(2)}`;
            } else {
                input.value = v;
            }
        }

        async function realizarCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('cadNome').value.trim();
            const usuario = document.getElementById('cadUsuario').value.trim();
            const telefone = document.getElementById('cadTelefone').value.replace(/\D/g, '');
            const turma = document.getElementById('cadTurma').value.trim();
            const senha = document.getElementById('cadSenha').value;
            const feedback = document.getElementById('cadastroFeedback');
            const btn = document.getElementById('btnCadastrar');

            feedback.className = 'auth-feedback-msg';
            feedback.style.display = 'none';

            if (!nome || !usuario || !telefone || !senha) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'Por favor, preencha todos os campos obrigatórios (*).';
                return;
            }

            if (senha.length < 6 || !/[0-9]/.test(senha) || !/[!@#$%^&*(),.?":{}|<>]/.test(senha)) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'A senha deve conter no mínimo 6 caracteres, 1 número e 1 símbolo (ex: @, #, !).';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando sua conta...';

            try {
                const res = await fetch(`${API_URL}/clientes/cadastrar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, usuario, telefone, turma, senha })
                });

                const data = await res.json();

                if (res.ok) {
                    feedback.className = 'auth-feedback-msg success';
                    feedback.innerHTML = '✅ Conta criada com sucesso! Autenticando...';

                    // Auto-login após cadastro
                    try {
                        const loginRes = await fetch(`${API_URL}/clientes/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ login: usuario, senha })
                        });
                        if (loginRes.ok) {
                            const loginData = await loginRes.json();
                            sessionStorage.setItem('cliente_token', loginData.token);
                            sessionStorage.setItem('cliente_nome', loginData.nome);
                            sessionStorage.setItem('cliente_id', loginData.id);
                            sessionStorage.setItem('cliente_usuario', loginData.usuario || usuario);
                            sessionStorage.setItem('cliente_pontos', loginData.pontosFidelidade || 0);

                            setTimeout(() => {
                                window.location.href = getReturnUrl();
                            }, 1000);
                            return;
                        }
                    } catch(e) {}

                    // Fallback se o auto-login falhar: redireciona para login
                    setTimeout(() => {
                        window.location.href = `login.html?returnUrl=${encodeURIComponent(getReturnUrl())}`;
                    }, 1200);
                } else {
                    feedback.className = 'auth-feedback-msg error';
                    feedback.textContent = data.erro || 'Erro ao cadastrar. Verifique se o usuário ou telefone já existem.';
                    btn.disabled = false;
                    btn.innerHTML = '<span>Criar Conta & Ativar Fidelidade</span> <i class="fas fa-check-circle"></i>';
                }
            } catch (error) {
                feedback.className = 'auth-feedback-msg error';
                feedback.textContent = 'Erro ao conectar ao servidor. Tente novamente.';
                btn.disabled = false;
                btn.innerHTML = '<span>Criar Conta & Ativar Fidelidade</span> <i class="fas fa-check-circle"></i>';
            }
        }
    </script>
</body>
</html>
